sonar.projectKey=networlddev_OpenHabLogViewer
sonar.organization=networlddev


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=OpenHabLogViewer
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Test files live next to the code they cover: register them as tests and keep
# them out of the main sources so they are not reported as uncovered code.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts

# Coverage is generated by `npm run coverage:lcov` in the CI SonarQube job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
