sonar.projectKey=networlddev_OpenHabLogViewer
sonar.organization=networlddev

# Source vs. test classification. Test files live next to the code they cover,
# so they are carved out of the main sources and registered as tests.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts

# Coverage is produced by `npm run coverage:lcov` (Node's built-in test runner).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
