name: Release

# On every push to main:
#   1. Measure how much changed since the last release tag.
#   2. Bump the version automatically and build + publish a GitHub Release.
#
# Version level is decided as follows (first match wins):
#   - A commit message since the last tag contains [major], [minor] or [patch]
#     -> that level is forced (priority: major > minor > patch).
#   - Otherwise the size of the change decides:
#       minor if >= MINOR_FILES_THRESHOLD changed files
#             OR >= MINOR_LINES_THRESHOLD changed lines (added + removed),
#       patch otherwise.
#
# Documentation / tooling changes (*.md, .github/** and .claude/**) are excluded
# from the size measurement, so a push that only touches those produces no
# release (unless a [major]/[minor]/[patch] keyword forces one).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # required to push the bump commit/tag and create a release

concurrency:
  group: release
  cancel-in-progress: false

env:
  MINOR_FILES_THRESHOLD: 5
  MINOR_LINES_THRESHOLD: 100

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history + tags needed to diff against the last release

      - name: Determine version bump
        id: bump
        run: |
          set -euo pipefail

          # Base to measure from: the last release tag (vX.Y.Z), or the empty
          # tree for the very first release so all files count as added.
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found; measuring full history."
            DIFF_BASE=$(git hash-object -t tree /dev/null) # empty tree
            LOG_RANGE="HEAD"
          else
            echo "Last release tag: $LAST_TAG"
            DIFF_BASE="$LAST_TAG"
            LOG_RANGE="${LAST_TAG}..HEAD"
          fi

          # Documentation / tooling paths that must not drive a version bump:
          # all Markdown, the GitHub config (workflows, skills, templates) and
          # the Claude config (instructions, skills, hooks, settings).
          EXCLUDE=(':(exclude)*.md' ':(exclude).github/*' ':(exclude).claude/*')

          # 1) Commit-message keyword override (priority: major > minor > patch).
          COMMITS=$(git log --format=%B "$LOG_RANGE")
          if echo "$COMMITS" | grep -qiF '[major]'; then
            LEVEL=major
            REASON="keyword [major]"
          elif echo "$COMMITS" | grep -qiF '[minor]'; then
            LEVEL=minor
            REASON="keyword [minor]"
          elif echo "$COMMITS" | grep -qiF '[patch]'; then
            LEVEL=patch
            REASON="keyword [patch]"
          else
            LEVEL=""
          fi

          # 2) Size-based heuristic (docs/CI excluded), unless a keyword decided already.
          CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" HEAD -- . "${EXCLUDE[@]}" | wc -l | tr -d ' ')
          CHANGED_LINES=$(git diff --numstat "$DIFF_BASE" HEAD -- . "${EXCLUDE[@]}" \
            | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { sum += $1 + $2 } END { print sum + 0 }')

          echo "Relevant changed files: $CHANGED_FILES"
          echo "Relevant changed lines: $CHANGED_LINES"

          if [ -z "$LEVEL" ]; then
            if [ "$CHANGED_FILES" -eq 0 ] && [ "$CHANGED_LINES" -eq 0 ]; then
              echo "Only documentation/CI changes (or nothing) since the last release; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CHANGED_FILES" -ge "$MINOR_FILES_THRESHOLD" ] || [ "$CHANGED_LINES" -ge "$MINOR_LINES_THRESHOLD" ]; then
              LEVEL=minor
            else
              LEVEL=patch
            fi
            REASON="size (${CHANGED_FILES} files / ${CHANGED_LINES} lines)"
          fi

          echo "Bump level: $LEVEL ($REASON)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.bump.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.bump.outputs.skip != 'true'
        run: npm ci

      - name: Bump version, commit and tag
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # --no-git-tag-version bumps package.json/package-lock.json without committing;
          # we create the commit and tag explicitly so we control the message.
          npm version "${{ steps.bump.outputs.level }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          # Pushes made with GITHUB_TOKEN do not trigger another workflow run,
          # so this does not cause an infinite release loop.
          git push origin HEAD:main --follow-tags

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.bump.outputs.skip != 'true'
        run: npm run build

      - name: Package build output
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PKG_NAME="openhab-log-viewer-${{ steps.version.outputs.tag }}"
          mkdir -p "release/${PKG_NAME}"
          cp -r dist "release/${PKG_NAME}/dist"
          cp -r deploy "release/${PKG_NAME}/deploy"
          cp package.json README.md "release/${PKG_NAME}/"
          tar -czf "${PKG_NAME}.tar.gz" -C release "${PKG_NAME}"
          (cd release && zip -r "../${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Create release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            openhab-log-viewer-*.tar.gz
            openhab-log-viewer-*.zip
