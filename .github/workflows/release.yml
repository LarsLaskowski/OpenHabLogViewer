name: Release

# Releases are created manually by pushing a SemVer tag (vX.Y.Z).
#
# This lets several PRs accumulate on main and be bundled into a single
# release whenever you decide to cut one, instead of producing a release
# on every push.
#
# To cut a release:
#   git tag v2.2.0
#   git push origin v2.2.0
#
# The pushed tag drives everything: the version is read from the tag name,
# package.json is aligned to it inside the build artifact (without an extra
# commit), the client/server are built, packaged and published as a GitHub
# Release with auto-generated notes.
#
# workflow_dispatch additionally allows triggering against an existing tag
# from the Actions UI.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v2.2.0)'
        required: true

permissions:
  contents: write # required to create the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          # Pass the GitHub-controlled context values through the environment so
          # they are never interpolated into the script body. The dispatch input
          # in particular is attacker-influenced, and direct ${{ }} substitution
          # would allow shell injection before the SemVer check below can run.
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Enforce a strict vMAJOR.MINOR.PATCH SemVer tag so the version we
          # derive from it is always well-formed.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not a valid vX.Y.Z SemVer tag."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # full history needed for generated release notes

      # Building the release with the oldest supported Node.js version (22)
      # keeps the bundle's esbuild target maximally conservative, so the same
      # single artifact stays compatible with Node.js 22, 24, and 26 hosts.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package.json to tag version
        run: |
          set -euo pipefail
          # Keep the packaged package.json in sync with the release tag.
          # --no-git-tag-version only edits the files; --allow-same-version
          # avoids failing when the version already matches the tag.
          npm version "${{ steps.tag.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package build output
        run: |
          set -euo pipefail
          PKG_NAME="openhab-log-viewer-${{ steps.tag.outputs.tag }}"
          mkdir -p "release/${PKG_NAME}"
          cp -r dist "release/${PKG_NAME}/dist"
          cp -r deploy "release/${PKG_NAME}/deploy"
          cp "${GITHUB_WORKSPACE}/package.json" README.md "release/${PKG_NAME}/"
          tar -czf "${PKG_NAME}.tar.gz" -C release "${PKG_NAME}"
          (cd release && zip -r "../${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            openhab-log-viewer-*.tar.gz
            openhab-log-viewer-*.zip
